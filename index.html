<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 800px;
        }
        .header {
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 20px 20px 0 0;
            text-align: center;
        }
        .header h1 { font-size: 28px; font-weight: 600; }
        .header p { font-size: 12px; opacity: 0.9; margin-top: 5px; }
        .setup {
            padding: 20px;
            border-bottom: 1px solid #eee;
        }
        .api-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .api-input-group input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        .api-input-group button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .api-status {
            font-size: 12px;
            color: #666;
            text-align: center;
        }
        .api-status.ready { color: #4caf50; font-weight: 600; }
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 85%;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.5;
        }
        .user-message {
            align-self: flex-end;
            background: #667eea;
            color: white;
            border-radius: 18px 18px 4px 18px;
        }
        .assistant-message {
            align-self: flex-start;
            background: #f0f0f0;
            color: #333;
            border-radius: 18px 18px 18px 4px;
        }
        .controls {
            padding: 20px;
            border-top: 1px solid #eee;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .status-text {
            padding: 12px;
            background: #f9f9f9;
            border-radius: 8px;
            font-size: 13px;
            color: #666;
            text-align: center;
        }
        .buttons {
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            color: white;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .btn-primary:active { transform: scale(0.98); }
        .btn-stop {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 107, 107, 0.7); }
            50% { box-shadow: 0 0 0 10px rgba(255, 107, 107, 0); }
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #666;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Jarvis</h1>
            <p>Your casual AI sidekick</p>
        </div>

        <div class="setup">
            <div class="api-input-group">
                <input type="password" id="apiKey" placeholder="Paste Groq API key" autocomplete="off">
                <button onclick="saveKey()">Save</button>
            </div>
            <div class="api-status" id="status">❌ No API key</div>
        </div>

        <div class="chat-area" id="chat"></div>

        <div class="controls">
            <div class="status-text" id="statusText">Press "Enable Mic" first</div>
            <div class="buttons">
                <button class="btn btn-primary" id="enableBtn" onclick="enableMic()">🎤 Enable Mic</button>
                <button class="btn btn-primary hidden" id="speakBtn" onclick="startSpeak()">Tap & Speak</button>
                <button class="btn btn-stop hidden" id="stopBtn" onclick="stopSpeak()">⏹️ Stop</button>
            </div>
            <button class="btn btn-secondary" onclick="clearChat()">Clear Chat</button>
        </div>
    </div>

    <script>
        let apiKey = localStorage.getItem('groqApiKey');
        let micEnabled = false;
        let isListening = false;
        let finalTranscript = '';
        let history = [];
        let recognition;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.continuous = false;
            recognition.interimResults = true;
        }

        // Save API key
        function saveKey() {
            const key = document.getElementById('apiKey').value.trim();
            if (key) {
                apiKey = key;
                localStorage.setItem('groqApiKey', apiKey);
                updateApiStatus();
            }
        }

        function updateApiStatus() {
            const el = document.getElementById('status');
            if (apiKey) {
                el.textContent = '✅ API key ready';
                el.classList.add('ready');
                document.getElementById('apiKey').style.display = 'none';
                document.querySelector('.api-input-group button').style.display = 'none';
            }
        }

        // Enable microphone
        function enableMic() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                document.getElementById('statusText').textContent = '❌ Microphone not supported';
                return;
            }

            document.getElementById('statusText').textContent = 'Requesting permission...';

            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    // Stop all tracks
                    stream.getTracks().forEach(track => track.stop());
                    
                    // Mic enabled
                    micEnabled = true;
                    document.getElementById('statusText').textContent = '✅ Microphone enabled';
                    document.getElementById('enableBtn').classList.add('hidden');
                    document.getElementById('speakBtn').classList.remove('hidden');
                })
                .catch(err => {
                    document.getElementById('statusText').textContent = '❌ ' + err.name;
                    console.log('Mic error:', err);
                });
        }

        // Start speaking
        function startSpeak() {
            if (!micEnabled) {
                document.getElementById('statusText').textContent = 'Enable mic first';
                return;
            }

            if (!apiKey) {
                document.getElementById('statusText').textContent = 'Add API key first';
                return;
            }

            if (isListening) return;

            isListening = true;
            finalTranscript = '';

            document.getElementById('statusText').textContent = 'Listening...';
            document.getElementById('speakBtn').classList.add('hidden');
            document.getElementById('stopBtn').classList.remove('hidden');

            try {
                recognition.start();
            } catch (e) {
                console.log('Start error:', e);
                isListening = false;
            }
        }

        // Stop speaking
        function stopSpeak() {
            if (!isListening) return;

            isListening = false;
            document.getElementById('stopBtn').classList.add('hidden');
            document.getElementById('speakBtn').classList.remove('hidden');
            document.getElementById('statusText').textContent = 'Processing...';

            try {
                recognition.stop();
            } catch (e) {
                console.log('Stop error:', e);
            }

            // Send after short delay to ensure recognition ends
            setTimeout(() => {
                if (finalTranscript.trim()) {
                    sendMessage(finalTranscript.trim());
                } else {
                    document.getElementById('statusText').textContent = '✅ Microphone enabled';
                }
            }, 100);
        }

        // Recognition events
        if (recognition) {
            recognition.onresult = (event) => {
                let interim = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript + ' ';
                    } else {
                        interim += transcript;
                    }
                }
                document.getElementById('statusText').textContent = finalTranscript + interim;
            };

            recognition.onend = () => {
                console.log('Recognition ended');
                if (isListening) {
                    isListening = false;
                    document.getElementById('stopBtn').classList.add('hidden');
                    document.getElementById('speakBtn').classList.remove('hidden');
                }
            };

            recognition.onerror = (event) => {
                console.log('Recognition error:', event.error);
                document.getElementById('statusText').textContent = '❌ Error: ' + event.error;
                isListening = false;
                document.getElementById('stopBtn').classList.add('hidden');
                document.getElementById('speakBtn').classList.remove('hidden');
            };
        }

        // Chat functions
        function addMsg(role, text) {
            const div = document.createElement('div');
            div.className = `message ${role}-message`;
            div.textContent = text;
            document.getElementById('chat').appendChild(div);
            document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
        }

        async function sendMessage(text) {
            addMsg('user', text);
            document.getElementById('statusText').textContent = '✅ Microphone enabled';

            history.push({ role: 'user', content: text });

            // Loading indicator
            const loading = document.createElement('div');
            loading.className = 'message assistant-message';
            loading.innerHTML = '...';
            document.getElementById('chat').appendChild(loading);
            document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;

            try {
                const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'mixtral-8x7b-32768',
                        messages: [
                            {
                                role: 'system',
                                content: 'You\'re Jarvis, a casual and jokey AI assistant. Think witty Tony Stark vibes. Keep responses under 100 words, be punchy and fun.'
                            },
                            ...history
                        ],
                        max_tokens: 256,
                        temperature: 0.8
                    })
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.error?.message || 'API error');
                }

                const data = await res.json();
                const reply = data.choices[0].message.content;

                history.push({ role: 'assistant', content: reply });
                loading.remove();
                addMsg('assistant', reply);

                // Speak
                if ('speechSynthesis' in window) {
                    const utterance = new SpeechSynthesisUtterance(reply);
                    speechSynthesis.speak(utterance);
                }
            } catch (err) {
                loading.remove();
                addMsg('assistant', 'Error: ' + err.message);
            }
        }

        function clearChat() {
            document.getElementById('chat').innerHTML = '';
            history = [];
            document.getElementById('statusText').textContent = '✅ Microphone enabled';
        }

        // Init
        updateApiStatus();
    </script>
</body>
</html>
